name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & Test (.NET)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PoRedoImage.slnx

      - name: Build
        run: dotnet build PoRedoImage.slnx --no-restore --configuration Release

      - name: Unit + Integration Tests (with coverage)
        run: |
          dotnet test PoRedoImage.slnx \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Coverage threshold gate (80%)
        run: |
          COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' TestResults/**/coverage.opencover.xml | awk '{sum+=$1; n++} END{printf "%.0f", sum/n*100}')
          echo "Coverage: ${COVERAGE}%"
          if [ "$COVERAGE" -lt 80 ]; then
            echo "::error::Coverage ${COVERAGE}% is below the 80% threshold"
            exit 1
          fi
        continue-on-error: true   # warn but don't fail build while coverage is being built up

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/

      - name: Publish coverage to summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: TestResults/**/coverage.opencover.xml

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/PoRedoImage.Web/PoRedoImage.Web.csproj --configuration Release --output ./publish

      - name: Zip publish output
        run: cd ./publish && zip -r ../app.zip . && cd ..

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        run: |
          az webapp deploy \
            --name poredoimage-web \
            --resource-group PoRedoImage \
            --src-path ./app.zip \
            --type zip

      - name: Smoke test /health
        run: |
          echo "Waiting for app to start..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://poredoimage-web.azurewebsites.net/health)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
              break
            fi
            echo "Attempt $i: got $STATUS, retrying in 10s..."
            sleep 10
          done
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://poredoimage-web.azurewebsites.net/health)
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed!"
