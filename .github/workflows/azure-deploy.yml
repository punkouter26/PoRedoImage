name: Deploy to Azure

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: 'PoRedoImage'
  AZURE_APP_NAME: 'poredoimage-web'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
        restore-keys: nuget-

    - name: Install fonts (Linux requirement for image processing)
      run: sudo apt-get install -y fonts-liberation

    - name: Publish
      run: dotnet publish src/PoRedoImage.Web/PoRedoImage.Web.csproj --configuration Release --output ./publish

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure App Service
      run: |
        cd ./publish && zip -r ../app.zip . && cd ..
        az webapp deploy \
          --name ${{ env.AZURE_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --src-path ./app.zip \
          --type zip \
          --async true

    - name: Set startup command
      run: |
        az webapp config set \
          --name ${{ env.AZURE_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --startup-file "dotnet /home/site/wwwroot/PoRedoImage.Web.dll"

    - name: Restart app
      run: az webapp restart --name ${{ env.AZURE_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

    - name: Smoke Test – /health
      run: |
        echo "Polling /health (up to 120s)..."
        for i in $(seq 1 24); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_APP_NAME }}.azurewebsites.net/health)
          echo "Attempt $i: HTTP $STATUS"
          [ "$STATUS" = "200" ] && break
          sleep 5
        done
        if [ "$STATUS" != "200" ]; then
          echo "::error::Health check failed with HTTP $STATUS"
          exit 1
        fi
        echo "Health check passed!"
