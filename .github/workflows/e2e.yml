name: E2E Tests

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true

jobs:
  e2e:
    name: Playwright E2E (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore & Build
        run: dotnet build PoRedoImage.slnx --configuration Release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/playwright/package.json

      - name: Install Playwright deps
        working-directory: tests/playwright
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run E2E tests (CI=true → headless)
        working-directory: tests/playwright
        env:
          CI: true
          # Key vault not available in CI; app starts with dev fallback
          ASPNETCORE_ENVIRONMENT: Development
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/playwright/playwright-report/
          retention-days: 7
