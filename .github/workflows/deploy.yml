name: Deploy to Azure

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: 'PoRedoImage'
  AZURE_APP_NAME: 'poredoimage-web'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: production
      url: https://poredoimage-web.azurewebsites.net
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
        restore-keys: nuget-

    - name: Verify formatting
      run: dotnet format PoRedoImage.slnx --verify-no-changes --verbosity minimal

    - name: Run unit tests
      run: dotnet test tests/PoRedoImage.Tests.Unit/PoRedoImage.Tests.Unit.csproj --configuration Release --logger "trx;LogFileName=unit-tests.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: "**/*.trx"

    - name: Install fonts (Linux requirement for image processing)
      run: sudo apt-get install -y fonts-liberation

    - name: Publish
      run: dotnet publish src/PoRedoImage.Web/PoRedoImage.Web.csproj --configuration Release --output ./publish

    - name: Azure Login (OIDC)
      uses: azure/login@v2.3.0
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure App Service
      run: |
        cd ./publish && zip -r ../app.zip . && cd ..
        # Synchronous deploy (no --async): waits until the platform confirms the
        # deployment slot is ready before proceeding. This avoids the race where
        # an explicit restart fires while the app is still initialising.
        az webapp deploy \
          --name ${{ env.AZURE_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --src-path ./app.zip \
          --type zip

    - name: Set startup command
      run: |
        az webapp config set \
          --name ${{ env.AZURE_APP_NAME }} \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --startup-file "dotnet /home/site/wwwroot/PoRedoImage.Web.dll"

    - name: Smoke Test – /health
      run: |
        echo "Waiting for app to come online (polling /alive)..."
        for i in $(seq 1 36); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://${{ env.AZURE_APP_NAME }}.azurewebsites.net/alive)
          echo "Attempt $i: /alive HTTP $STATUS"
          [ "$STATUS" = "200" ] && break
          sleep 5
        done
        if [ "$STATUS" != "200" ]; then
          echo "::error::App did not come online within 3 minutes"
          exit 1
        fi
        echo "App is online. Checking /health (all services)..."
        HEALTH=$(curl -s --max-time 60 https://${{ env.AZURE_APP_NAME }}.azurewebsites.net/health)
        echo "$HEALTH"
        STATUS=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print('200' if d.get('status')=='Healthy' else '503')" 2>/dev/null || echo "parse-error")
        if [ "$STATUS" != "200" ]; then
          echo "::warning::Some health checks are not healthy (non-fatal)"
        fi
        echo "Deploy succeeded!"
