name: Deploy to Azure

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_APP_NAME: 'poredoimage-web'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Build & Test ─────────────────────────────────────────────────────────────
  # Runs on every push and pull request to catch regressions early.
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
        restore-keys: nuget-

    - name: Verify formatting
      run: dotnet format PoRedoImage.slnx --verify-no-changes --verbosity minimal

    - name: Install fonts (Linux requirement for image processing)
      run: sudo apt-get install -y fonts-liberation

    - name: Run unit tests
      run: dotnet test tests/PoRedoImage.Tests.Unit/PoRedoImage.Tests.Unit.csproj --configuration Release --logger "trx;LogFileName=unit-tests.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: "**/*.trx"

    - name: Publish
      run: dotnet publish src/PoRedoImage.Web/PoRedoImage.Web.csproj --configuration Release --output ./publish

    - name: Upload publish artifact
      uses: actions/upload-artifact@v4
      with:
        name: publish
        path: ./publish
        retention-days: 1

  # ── Deploy ───────────────────────────────────────────────────────────────────
  # Runs only on master pushes and manual dispatches, after build-and-test passes.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://poredoimage-web.azurewebsites.net
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Download publish artifact
      uses: actions/download-artifact@v4
      with:
        name: publish
        path: ./publish

    - name: Azure Login (OIDC)
      uses: azure/login@v2.3.0
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_APP_NAME }}
        package: ./publish

    - name: Smoke Test – /health
      run: |
        echo "Waiting for app to come online (polling /alive)..."
        sleep 30
        for i in $(seq 1 30); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://${{ env.AZURE_APP_NAME }}.azurewebsites.net/alive 2>/dev/null) || STATUS="000"
          echo "Attempt $i: /alive HTTP $STATUS"
          [ "$STATUS" = "200" ] && break
          sleep 10
        done
        if [ "$STATUS" != "200" ]; then
          echo "::warning::App did not return 200 on /alive within 5 minutes — cold start may still be in progress"
        else
          echo "App is online. Checking /health (all services)..."
          HEALTH=$(curl -s --max-time 60 https://${{ env.AZURE_APP_NAME }}.azurewebsites.net/health 2>/dev/null) || HEALTH="{}"
          echo "$HEALTH"
          HSTATUS=$(echo "$HEALTH" | grep -o '"status":"[^"]*"' | head -1 | grep -c '"Healthy"' || echo "0")
          [ "$HSTATUS" = "0" ] && echo "::warning::Health endpoint not fully healthy (non-fatal)" || true
        fi
        echo "Deploy step complete!"
