name: CI/CD — Build, Test & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: poredoimage-web
  AZURE_RESOURCE_GROUP: PoRedoImage
  SOLUTION_PATH: PoRedoImage.slnx
  API_PROJECT_PATH: src/PoRedoImage.Web/PoRedoImage.Web.csproj
  # Expected App Service Plan (F1 Free, westus2 Linux) — owned by the PoRedoImage RG and
  # provisioned by infra/main.bicep. Asserted post-deploy to catch plan drift.
  EXPECTED_PLAN: asp-poredoimage-f1
  # Run pre-June-16-2026 Node 20 actions on Node 24 ahead of the forced migration.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore ${{ env.SOLUTION_PATH }}
      - run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore -c Release
      # Tests are intentionally NOT run in CI/CD (project policy): the pipeline only
      # builds and ships. Run unit/integration/E2E suites locally or via a dedicated,
      # non-deploy workflow. See AGENT.MD §Testing.
      # Publish + artifact upload are only consumed by the deploy job (push /
      # workflow_dispatch). Skip them on pull_request to cut PR CI time.
      - if: github.event_name != 'pull_request'
        run: dotnet publish ${{ env.API_PROJECT_PATH }} -c Release --no-restore -o publish
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: publish
          retention-days: 1

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    environment:
      name: production
      url: https://poredoimage-web.azurewebsites.net
    steps:
      - uses: actions/checkout@v4 # needed for the infra/main.bicep what-if preflight
      - uses: actions/download-artifact@v4
        with:
          name: webapp
          path: publish
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure (bicep)
        # Applies infra/main.bicep so the F1 plan (asp-poredoimage-f1) exists and the web
        # app is bound to it. Idempotent — converges storage, plan, and site config every run.
        # This is what re-parents the app onto the expected plan; the verify step below asserts it.
        run: |
          az deployment group create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --name "ci-${{ github.run_id }}"
      - run: cd publish && zip -r ../webapp.zip . && cd ..
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: webapp.zip
      - name: Bind Key Vault Secrets User role
        # Grants the freshly-provisioned app's system-assigned managed identity
        # read access to the shared Key Vault. Without this, every
        # `@Microsoft.KeyVault(...)` app setting resolves to an empty string
        # and the app fails its StartupSecretValidator in Production.
        run: |
          PRINCIPAL=$(az webapp show -g ${{ env.AZURE_RESOURCE_GROUP }} -n ${{ env.AZURE_WEBAPP_NAME }} \
            --query identity.principalId -o tsv)
          if [ -z "$PRINCIPAL" ] || [ "$PRINCIPAL" = "None" ]; then
            echo "::error::App has no system-assigned identity; re-check infra/main.bicep."
            exit 1
          fi
          VAULT="/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/PoShared/providers/Microsoft.KeyVault/vaults/kv-poshared"
          # Idempotent: ignore AlreadyExists so re-runs are clean.
          az role assignment create --role "Key Vault Secrets User" \
            --assignee "$PRINCIPAL" --scope "$VAULT" 2>&1 \
            | grep -v "AlreadyExists" || true
          # Verify the binding is in place; fail the pipeline if not.
          az role assignment list --assignee "$PRINCIPAL" --scope "$VAULT" \
            --query "[?roleDefinitionName=='Key Vault Secrets User'] | length(@)" -o tsv \
            | xargs -I{} test {} -ge 1

      - name: Verify App Service Plan binding & state
        # Hard-fail when the app is not on the expected F1 plan (asp-poredoimage-f1).
        # An empty/unresolved plan is also a hard failure (no silent warnings).
        run: |
          STATE=$(az webapp show -g ${{ env.AZURE_RESOURCE_GROUP }} -n ${{ env.AZURE_WEBAPP_NAME }} --query state -o tsv)
          # serverFarmId is the raw ARM property (reliable); appServicePlanId is a
          # CLI alias that came back blank on the runner.
          PLAN_ID=$(az resource show -g ${{ env.AZURE_RESOURCE_GROUP }} -n ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-type Microsoft.Web/sites --query properties.serverFarmId -o tsv)
          PLAN=${PLAN_ID##*/} # plan name = last path segment of the resource id
          echo "State=$STATE  Plan=${PLAN:-<unresolved>}  (expected plan: ${{ env.EXPECTED_PLAN }})"
          if [ "$STATE" != "Running" ]; then
            echo "::error::App state is '$STATE', expected 'Running'."
            exit 1
          fi
          if [ -z "$PLAN" ] || [ "$PLAN" = "<unresolved>" ]; then
            echo "::error::Could not resolve the App Service Plan id — bicep deploy may have failed silently."
            exit 1
          fi
          if [ "$PLAN" != "${{ env.EXPECTED_PLAN }}" ]; then
            echo "::error::App is on plan '$PLAN', expected '${{ env.EXPECTED_PLAN }}'. The bicep deploy should have bound it to the F1 plan."
            exit 1
          fi
      - name: Verify deployment (health + diag smoke test)
        # Hits the live prod endpoints with a guest session cookie so the
        # masked config payload can be read back. A 200 from /health is
        # necessary but not sufficient — /api/diag returning masked config
        # proves the Key Vault → managed identity → app pipeline works.
        run: |
          sleep 20
          BASE="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for i in 1 2 3 4 5; do
            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/health" --max-time 30 || echo "000")
            echo "Health check attempt $i: HTTP $HEALTH"
            if [ "$HEALTH" = "200" ]; then
              # Bootstrap a guest session then assert the masked config payload.
              curl -s -c /tmp/cookies.txt -o /dev/null "$BASE/dev-login?email=smoke@guest.local"
              DIAG=$(curl -s -b /tmp/cookies.txt "$BASE/api/diag" --max-time 30 || echo "")
              if echo "$DIAG" | grep -q "OpenAI"; then
                echo "Diag payload contains OpenAI — Key Vault + MI binding verified."
                echo "$DIAG" | head -c 400; echo
                exit 0
              else
                echo "::warning::Diag payload missing OpenAI on attempt $i: ${DIAG:0:200}"
              fi
            fi
            sleep 15
          done
          echo "::error::Health check did not return 200 with valid diag after 5 attempts."
          exit 1