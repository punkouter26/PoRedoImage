# Azurite for the LOCAL DEV INNER LOOP ONLY (F5 / `dotnet run`).
# The TEST suites do NOT use this container — the Integration tier spins up its own ephemeral
# Azurite via Testcontainers inside the WebApplicationFactory lifecycle (see
# tests/PoRedoImage.Tests.Integration/AzuriteContainerFixture.cs). Keeping the two paths separate
# means a stale dev container can never leak state into a test run. See ADR-019.
services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: poredoimage-azurite-dev
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose --location /data"
    ports:
      - "10000:10000"   # Blob service
      - "10001:10001"   # Queue service
      - "10002:10002"   # Table service
    volumes:
      # Named volume (ephemeral, Docker-managed) instead of a repo bind-mount. The old
      # ./.azurite-data bind-mount committed emulator state into the working tree and let stale
      # tables/blobs persist across runs; a named volume keeps dev data out of git and easy to reset
      # (`docker compose down -v`).
      - poredoimage-azurite-data:/data

volumes:
  poredoimage-azurite-data:
